name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
    env:
      STREAM_PROJECT_DIR: ${{ github.workspace }}
      KAFKA_BOOTSTRAP: localhost:9092
      KAFKA_TOPIC: wikipedia.recentchange
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - run: scripts/ci.sh
