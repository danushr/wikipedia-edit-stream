[project]
name = "wikipedia-edit-stream"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pyspark>=4.0,<4.1",
  "delta-spark>=4.0,<4.1",
  "confluent-kafka>=2.6",
  "requests>=2.32",
  "streamlit>=1.40",
  "pandas>=2.2",
  "deltalake>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["kafka: needs a Kafka broker at KAFKA_BOOTSTRAP"]
